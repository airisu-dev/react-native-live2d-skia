name: Test Build

# The `changes` job picks the platforms to build and lists why in the run summary; the rules are in
# packages/react-native-live2d-skia/scripts/changedAreas.ts. A draft builds nothing until it is
# ready for review, and the `native-build` label forces both platforms.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      android:
        description: Build Android
        type: boolean
        default: true
      ios:
        description: Build iOS
        type: boolean
        default: true

concurrency:
  group: test-build-${{ github.ref }}
  # A new push replaces the running builds; adding a label must not cancel them.
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

env:
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  changes:
    name: changed native areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.areas.outputs.android }}
      ios: ${{ steps.areas.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: areas
        run: bun packages/react-native-live2d-skia/scripts/changedAreas.ts
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ANDROID: ${{ inputs.android }}
          IOS: ${{ inputs.ios }}

  # Fetch the SDK once so the matrix legs do not all download it on a cold cache.
  sdk:
    name: fetch Cubism SDK
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - id: cache
        uses: actions/cache@v4
        with:
          path: apps/app/vendor/CubismSdkForNative-*.zip
          key: cubism-sdk-${{ hashFiles('scripts/fetch-cubism-sdk.sh', 'packages/react-native-live2d-skia/package.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-cubism-sdk.sh

  android:
    name: android (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes, sdk]
    if: needs.changes.outputs.android == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [app, app-skia2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - uses: actions/cache/restore@v4
        with:
          path: apps/app/vendor/CubismSdkForNative-*.zip
          key: cubism-sdk-${{ hashFiles('scripts/fetch-cubism-sdk.sh', 'packages/react-native-live2d-skia/package.json') }}
          fail-on-cache-miss: true
      - run: bash scripts/fetch-cubism-sdk.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - id: ndk
        run: echo "version=$(awk -F'"' '/^ndkVersion/ {print $2}' node_modules/react-native/gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ steps.ndk.outputs.version }}
            /usr/local/lib/android/sdk/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-ndk-${{ steps.ndk.outputs.version }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-${{ hashFiles('node_modules/react-native/gradle/libs.versions.toml') }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Prebuild
        working-directory: apps/${{ matrix.app }}
        run: bunx expo prebuild --platform android --no-install
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles(format('apps/{0}/android/gradle/wrapper/gradle-wrapper.properties', matrix.app)) }}
      - name: Build debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a

  ios:
    name: ios (${{ matrix.app }})
    runs-on: macos-26
    timeout-minutes: 90
    needs: [changes, sdk]
    if: needs.changes.outputs.ios == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [app, app-skia2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - uses: actions/cache/restore@v4
        with:
          path: apps/app/vendor/CubismSdkForNative-*.zip
          key: cubism-sdk-${{ hashFiles('scripts/fetch-cubism-sdk.sh', 'packages/react-native-live2d-skia/package.json') }}
          fail-on-cache-miss: true
      - run: bash scripts/fetch-cubism-sdk.sh

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Prebuild
        working-directory: apps/${{ matrix.app }}
        run: bunx expo prebuild --platform ios --no-install

      - uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/ios/Pods
          key: pods-${{ matrix.app }}-${{ hashFiles('bun.lock', format('apps/{0}/app.json', matrix.app)) }}
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ReactNative
          key: react-native-prebuilt-${{ hashFiles('bun.lock') }}
      - name: Install pods
        working-directory: apps/${{ matrix.app }}/ios
        run: pod install

      - name: Build for simulator
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          WORKSPACES=$(find ios -maxdepth 1 -name '*.xcworkspace')
          if [ "$(echo "$WORKSPACES" | grep -c .)" != "1" ]; then
            echo "::error::Expected exactly one .xcworkspace in ios/, found: ${WORKSPACES:-none}"
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACES" .xcworkspace)
          xcodebuild -workspace "$WORKSPACES" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
